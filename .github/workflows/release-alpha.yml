name: Alpha Release

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - alpha

concurrency:
  group: alpha-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: none

jobs:
  release_gate:
    name: Resolve releasable Alpha head
    if: github.repository == 'TheBlankClub/t3code-alpha'
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout Alpha
        uses: actions/checkout@v6
        with:
          ref: alpha
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: gate
        name: Reject failed, stale, or already released commits
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          if [[ "$TRIGGER_EVENT" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_EVENT" != "push" || "$WORKFLOW_CONCLUSION" != "success" ]]; then
              echo "Ignoring a CI run that was not a successful Alpha push."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "reason=triggering CI was not a successful push" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$WORKFLOW_HEAD_SHA" != "$source_sha" ]]; then
              echo "Ignoring stale CI for $WORKFLOW_HEAD_SHA; Alpha is now $source_sha."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "reason=triggering CI SHA is stale" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          existing_tag="$(git tag --points-at "$source_sha" --list 'v*-alpha.*' | head -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
            echo "Alpha $source_sha is already released as $existing_tag."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=source commit already has an Alpha release tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Alpha $source_sha passed the release gate."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "reason=source commit is current, CI-approved when applicable, and unreleased" >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight
    needs: [release_gate]
    if: needs.release_gate.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      ref: ${{ needs.release_gate.outputs.source_sha }}
    steps:
      - name: Checkout Alpha
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_gate.outputs.source_sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Validate Alpha automation access
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ALPHA_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ALPHA_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: t3code-alpha

      - id: release_meta
        name: Resolve Alpha version
        shell: bash
        env:
          ALPHA_RUN_NUMBER: ${{ github.run_number }}
          ALPHA_SHA: ${{ needs.release_gate.outputs.source_sha }}
        run: |
          alpha_date="$(date -u +%Y%m%d)"
          node scripts/resolve-alpha-release.ts \
            --date "$alpha_date" \
            --run-number "$ALPHA_RUN_NUMBER" \
            --sha "$ALPHA_SHA" \
            --github-output

      - id: previous_tag
        name: Resolve previous Alpha tag
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          previous_tag="$(git tag --list 'v*-alpha.*' --sort=-version:refname | grep -Fvx "$CURRENT_TAG" | head -n 1 || true)"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: alpha-wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.label }}
    needs: [preflight, build_wsl_node_pty]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install persistent Alpha macOS signing identity
        if: matrix.platform == 'mac'
        timeout-minutes: 5
        shell: bash
        env:
          ALPHA_MAC_SIGNING_P12_BASE64: ${{ secrets.ALPHA_MAC_SIGNING_P12_BASE64 }}
          ALPHA_MAC_SIGNING_P12_PASSWORD: ${{ secrets.ALPHA_MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ALPHA_MAC_SIGNING_P12_BASE64" || -z "$ALPHA_MAC_SIGNING_P12_PASSWORD" ]]; then
            echo "Alpha macOS signing secrets are not configured." >&2
            exit 1
          fi

          signing_keychain="$RUNNER_TEMP/t3code-alpha-signing.keychain-db"
          signing_keychain_password="$(openssl rand -base64 32)"
          signing_p12="$RUNNER_TEMP/t3code-alpha-release-signing.p12"
          printf '%s' "$ALPHA_MAC_SIGNING_P12_BASE64" | base64 -D > "$signing_p12"

          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          # macOS 15 runners resolve signing identities through the user keychain
          # search list; codesign --keychain alone cannot see the imported identity.
          security list-keychains -d user -s "$signing_keychain" login.keychain
          security import "$signing_p12" \
            -k "$signing_keychain" \
            -P "$ALPHA_MAC_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign
          if ! security set-key-partition-list \
            -S apple-tool:,apple: \
            -l "T3 Code Alpha Release Signing" \
            -k "$signing_keychain_password" \
            "$signing_keychain"; then
            echo "::warning::Could not confirm the imported key's partition list; continuing to the signing probe."
          fi

          expected_fingerprint="$(openssl x509 \
            -inform der \
            -in assets/alpha/signing/t3code-alpha-release-signing.cer \
            -noout \
            -fingerprint \
            -sha1 | cut -d= -f2 | tr -d ':')"
          security find-certificate -a -Z "$signing_keychain" \
            | grep -Fq "SHA-1 hash: $expected_fingerprint"

          # The Alpha certificate is self-signed, so it fails trust evaluation
          # until it is trusted explicitly. electron-builder resolves identities
          # with `security find-identity -v`, which reports only trust-valid
          # certificates, and silently skips signing when it finds none. That
          # lookup passes no policy, so the trust setting must not be scoped to
          # one either.
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -k /Library/Keychains/System.keychain \
            assets/alpha/signing/t3code-alpha-release-signing.cer

          signing_probe="$RUNNER_TEMP/t3code-alpha-signing-probe"
          cp /usr/bin/true "$signing_probe"
          codesign --force \
            --keychain "$signing_keychain" \
            --sign "T3 Code Alpha Release Signing" \
            "$signing_probe"
          probe_requirement="=certificate leaf = H\"$expected_fingerprint\""
          codesign --verify \
            --strict \
            --verbose=2 \
            --test-requirement "$probe_requirement" \
            "$signing_probe"
          rm -f "$signing_probe" "$signing_p12"

          # `codesign --sign` succeeds with an untrusted certificate, so the
          # probe above cannot prove the build will sign. Assert the identity
          # the way electron-builder looks it up, or an unsigned app reaches the
          # seal check as a confusing "not signed at all" failure.
          if ! security find-identity -v "$signing_keychain" \
            | grep -Fq "$expected_fingerprint"; then
            echo "Alpha signing identity is present but not valid for signing." >&2
            security find-identity "$signing_keychain" >&2 || true
            exit 1
          fi

          echo "CSC_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"
          echo "ALPHA_MAC_SIGNING_IDENTITY=T3 Code Alpha Release Signing" >> "$GITHUB_ENV"

      - name: Align package versions to Alpha version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v7
        with:
          name: alpha-wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Build desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
          fi
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            args+=(--mac-signing-identity "$ALPHA_MAC_SIGNING_IDENTITY")
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify macOS application seal
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          dmg_paths=(release/*.dmg)
          if [[ ${#dmg_paths[@]} -ne 1 ]]; then
            echo "Expected exactly one macOS DMG, found ${#dmg_paths[@]}." >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmg_paths[0]}" >/dev/null
          app="$mount_dir/T3 Code Alpha.app"
          codesign --verify --deep --strict --verbose=2 "$app"

          signature_details="$(codesign -dvvv "$app" 2>&1)"
          grep -Fq "Identifier=com.theblankclub.t3code.alpha" <<<"$signature_details"
          if grep -Fq "Signature=adhoc" <<<"$signature_details"; then
            echo "Alpha release unexpectedly has an ad-hoc signature." >&2
            exit 1
          fi

          certificate_fingerprint="$(openssl x509 \
            -inform der \
            -in assets/alpha/signing/t3code-alpha-release-signing.cer \
            -noout \
            -fingerprint \
            -sha1 | cut -d= -f2 | tr -d ':')"
          requirement="=identifier \"com.theblankclub.t3code.alpha\" and certificate leaf = H\"$certificate_fingerprint\""
          codesign --verify \
            --deep \
            --strict \
            --test-requirement "$requirement" \
            "$app"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.AppImage" \
            "release/*.exe"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Collect resource monitor
        shell: bash
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          source_path="native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}"
          target_dir="resource-monitor-publish/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "$source_path" "$target_dir/$binary_name"

      - name: Upload desktop assets
        uses: actions/upload-artifact@v7
        with:
          name: alpha-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 2

      - name: Upload resource monitor
        uses: actions/upload-artifact@v7
        with:
          name: alpha-resource-monitor-${{ matrix.resource_key }}
          path: resource-monitor-publish/${{ matrix.resource_key }}/*
          if-no-files-found: error
          retention-days: 2

      # The trust setting is deliberately left in place. `remove-trusted-cert`
      # takes no keychain argument and blocks on interactive authorization even
      # under `sudo`, which hangs the job until its timeout. Hosted runners are
      # ephemeral, so the System Keychain is destroyed with the VM anyway. The
      # bounded timeout keeps any future cleanup command from hanging a release.
      - name: Remove temporary Alpha signing keychain
        if: always() && matrix.platform == 'mac'
        timeout-minutes: 2
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/t3code-alpha-signing.keychain-db" || true

  publish_cli:
    name: Publish t3code-alpha to npm
    needs: [preflight, build]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Setup npm publishing
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Align package versions to Alpha version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build CLI package
        run: vp run --filter t3 build

      - name: Download resource monitors
        uses: actions/download-artifact@v8
        with:
          pattern: alpha-resource-monitor-*
          path: ${{ runner.temp }}/resource-monitors

      - name: Bundle resource monitors into CLI package
        shell: bash
        run: |
          set -euo pipefail
          for artifact_dir in "$RUNNER_TEMP"/resource-monitors/alpha-resource-monitor-*; do
            resource_key="${artifact_dir##*/alpha-resource-monitor-}"
            target_dir="apps/server/dist/resource-monitor/${resource_key}"
            mkdir -p "$target_dir"
            cp "$artifact_dir"/t3-resource-monitor* "$target_dir/"
            chmod +x "$target_dir"/t3-resource-monitor 2>/dev/null || true
          done

      - name: Publish Alpha CLI package
        run: node apps/server/scripts/cli.ts publish --tag latest --app-version "${{ needs.preflight.outputs.version }}" --provenance --verbose

  release:
    name: Publish GitHub prerelease
    needs: [preflight, build, publish_cli]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.publish_cli.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop assets
        uses: actions/download-artifact@v8
        with:
          pattern: alpha-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish Alpha prerelease
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.exe
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish first Alpha prerelease
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.exe
          fail_on_unmatched_files: true
          token: ${{ github.token }}

  report_status:
    name: Report Alpha release status
    needs:
      - release_gate
      - preflight
      - build_wsl_node_pty
      - build
      - publish_cli
      - release
    if: >-
      always() &&
      (needs.release_gate.result == 'failure' || needs.release_gate.outputs.should_release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - id: result
        name: Resolve release result
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' \
            <<< "$NEEDS_JSON" >/dev/null; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release failure issue
        if: steps.result.outputs.failed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release_gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/alpha-release-failure.md"
          {
            echo "Alpha release automation did not complete."
            echo
            echo "- Source: \`${SOURCE_SHA:-unknown}\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "The source commit remains on \`alpha\`; no rollback or replacement release was attempted."
          } > "$body_file"
          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'Alpha release is blocked in:title' \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Alpha release is blocked" \
              --body-file "$body_file"
          fi

      - name: Resolve previous release failure
        if: steps.result.outputs.failed == 'false' && needs.release.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'Alpha release is blocked in:title' \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            gh issue close "$existing_issue" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Alpha release completed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi
