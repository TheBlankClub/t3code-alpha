name: Alpha Release

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: alpha-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: none

jobs:
  check_changes:
    name: Check for changes since last Alpha
    if: github.repository == 'TheBlankClub/t3code-alpha' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout Alpha
        uses: actions/checkout@v6
        with:
          ref: alpha
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: check
        name: Compare Alpha to the last release tag
        shell: bash
        run: |
          set -euo pipefail
          last_alpha_tag="$(git tag --list 'v*-alpha.*' --sort=-version:refname | head -n 1 || true)"
          if [[ -z "$last_alpha_tag" ]]; then
            echo "No previous Alpha tag found. Proceeding with release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_alpha_sha="$(git rev-parse "$last_alpha_tag^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          if [[ "$last_alpha_sha" == "$head_sha" ]]; then
            echo "No changes on Alpha since $last_alpha_tag. Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected since $last_alpha_tag. Proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight
    needs: [check_changes]
    if: |
      github.repository == 'TheBlankClub/t3code-alpha' &&
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      ref: ${{ steps.source.outputs.ref }}
    steps:
      - name: Checkout Alpha
        uses: actions/checkout@v6
        with:
          ref: alpha
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Validate Alpha automation access
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ALPHA_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ALPHA_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            t3code-alpha
            homebrew-tap

      - id: source
        name: Resolve source commit
        shell: bash
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: release_meta
        name: Resolve Alpha version
        shell: bash
        env:
          ALPHA_RUN_NUMBER: ${{ github.run_number }}
          ALPHA_SHA: ${{ steps.source.outputs.ref }}
        run: |
          alpha_date="$(date -u +%Y%m%d)"
          node scripts/resolve-alpha-release.ts \
            --date "$alpha_date" \
            --run-number "$ALPHA_RUN_NUMBER" \
            --sha "$ALPHA_SHA" \
            --github-output

      - id: previous_tag
        name: Resolve previous Alpha tag
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          previous_tag="$(git tag --list 'v*-alpha.*' --sort=-version:refname | grep -Fvx "$CURRENT_TAG" | head -n 1 || true)"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: alpha-wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.label }}
    needs: [preflight, build_wsl_node_pty]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to Alpha version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v7
        with:
          name: alpha-wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Build desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.AppImage" \
            "release/*.exe"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Collect resource monitor
        shell: bash
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          source_path="native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}"
          target_dir="resource-monitor-publish/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "$source_path" "$target_dir/$binary_name"

      - name: Upload desktop assets
        uses: actions/upload-artifact@v7
        with:
          name: alpha-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 2

      - name: Upload resource monitor
        uses: actions/upload-artifact@v7
        with:
          name: alpha-resource-monitor-${{ matrix.resource_key }}
          path: resource-monitor-publish/${{ matrix.resource_key }}/*
          if-no-files-found: error
          retention-days: 2

  publish_cli:
    name: Publish t3code-alpha to npm
    needs: [preflight, build]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Setup npm publishing
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Align package versions to Alpha version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build CLI package
        run: vp run --filter t3 build

      - name: Download resource monitors
        uses: actions/download-artifact@v8
        with:
          pattern: alpha-resource-monitor-*
          path: ${{ runner.temp }}/resource-monitors

      - name: Bundle resource monitors into CLI package
        shell: bash
        run: |
          set -euo pipefail
          for artifact_dir in "$RUNNER_TEMP"/resource-monitors/alpha-resource-monitor-*; do
            resource_key="${artifact_dir##*/alpha-resource-monitor-}"
            target_dir="apps/server/dist/resource-monitor/${resource_key}"
            mkdir -p "$target_dir"
            cp "$artifact_dir"/t3-resource-monitor* "$target_dir/"
            chmod +x "$target_dir"/t3-resource-monitor 2>/dev/null || true
          done

      - name: Publish Alpha CLI package
        run: node apps/server/scripts/cli.ts publish --tag latest --app-version "${{ needs.preflight.outputs.version }}" --provenance --verbose

  release:
    name: Publish GitHub prerelease
    needs: [preflight, build, publish_cli]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.publish_cli.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop assets
        uses: actions/download-artifact@v8
        with:
          pattern: alpha-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish Alpha prerelease
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.exe
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish first Alpha prerelease
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.exe
          fail_on_unmatched_files: true
          token: ${{ github.token }}

  publish_homebrew:
    name: Publish Homebrew cask
    needs: [preflight, release]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download macOS assets
        uses: actions/download-artifact@v8
        with:
          pattern: alpha-desktop-mac-*
          merge-multiple: true
          path: release-assets

      - id: app_token
        name: Mint Homebrew tap token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ALPHA_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ALPHA_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: TheBlankClub/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ steps.app_token.outputs.token }}

      - id: app_bot
        name: Resolve GitHub App bot identity
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Render Homebrew cask
        shell: bash
        env:
          ALPHA_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/render-alpha-homebrew-cask.ts \
            --version "$ALPHA_VERSION" \
            --arm64-path "release-assets/T3-Code-Alpha-${ALPHA_VERSION}-arm64.dmg" \
            --x64-path "release-assets/T3-Code-Alpha-${ALPHA_VERSION}-x64.dmg" \
            --output homebrew-tap/Casks/t3code-alpha.rb

      - name: Prepare Homebrew cask commit
        shell: bash
        env:
          APP_BOT_NAME: ${{ steps.app_bot.outputs.name }}
          APP_BOT_EMAIL: ${{ steps.app_bot.outputs.email }}
          ALPHA_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          git -C homebrew-tap config user.name "$APP_BOT_NAME"
          git -C homebrew-tap config user.email "$APP_BOT_EMAIL"
          git -C homebrew-tap add Casks/t3code-alpha.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew cask already matches $ALPHA_VERSION."
          else
            git -C homebrew-tap commit -m "chore: update t3code-alpha to $ALPHA_VERSION"
          fi

      - name: Audit Homebrew cask
        shell: bash
        run: |
          set -euo pipefail
          ruby -c homebrew-tap/Casks/t3code-alpha.rb
          brew style homebrew-tap/Casks/t3code-alpha.rb
          brew tap theblankclub/tap "$GITHUB_WORKSPACE/homebrew-tap"
          brew audit --cask --strict theblankclub/tap/t3code-alpha

      - name: Publish Homebrew cask
        shell: bash
        run: |
          set -euo pipefail
          git -C homebrew-tap push origin HEAD:main
