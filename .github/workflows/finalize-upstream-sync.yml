name: Finalize Upstream Sync

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - automation/upstream-main

concurrency:
  group: finalize-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finalize:
    name: Journal and merge conflict-free upstream sync
    if: >-
      github.repository == 'TheBlankClub/t3code-alpha' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: app_token
        name: Mint Alpha automation token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ALPHA_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ALPHA_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - id: pull_request
        name: Resolve automatic sync pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          pr_number="$EVENT_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base alpha \
              --head automation/upstream-main \
              --state open \
              --json number \
              --jq '.[0].number // empty')"
          fi
          if [[ -z "$pr_number" ]]; then
            echo "No open upstream sync pull request remains."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels="$(gh pr view "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels \
            --jq '[.labels[].name]')"
          if ! jq -e 'index("alpha-auto-sync") != null' <<< "$labels" >/dev/null; then
            echo "Pull request $pr_number is not eligible for automatic reconciliation."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Report failed candidate CI
        if: >-
          steps.pull_request.outputs.eligible == 'true' &&
          github.event.workflow_run.conclusion != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/upstream-ci-failure.md"
          {
            echo "A conflict-free upstream candidate failed required CI and was not merged."
            echo
            echo "- Pull request: #${{ steps.pull_request.outputs.number }}"
            echo "- CI: ${{ github.event.workflow_run.html_url }}"
            echo "- Conclusion: \`${{ github.event.workflow_run.conclusion }}\`"
          } > "$body_file"
          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'Upstream sync is blocked in:title' \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Upstream sync is blocked" \
              --body-file "$body_file"
          fi
          exit 1

      - name: Checkout sync candidate
        if: >-
          steps.pull_request.outputs.eligible == 'true' &&
          github.event.workflow_run.conclusion == 'success'
        uses: actions/checkout@v6
        with:
          ref: automation/upstream-main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node
        if: >-
          steps.pull_request.outputs.eligible == 'true' &&
          github.event.workflow_run.conclusion == 'success'
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - id: state
        name: Verify tested candidate and journal state
        if: >-
          steps.pull_request.outputs.eligible == 'true' &&
          github.event.workflow_run.conclusion == 'success'
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_head="$(git rev-parse HEAD)"
          if [[ "$current_head" != "$TESTED_SHA" ]]; then
            echo "The sync branch advanced after this CI run; a newer run will finalize it."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "head=$current_head" >> "$GITHUB_OUTPUT"

          latest_candidate="$(tail -n 1 .alpha/reconciliation.jsonl | jq -r '.candidate // empty')"
          if [[ -n "$latest_candidate" ]] && \
             [[ "$(git rev-parse HEAD^)" == "$latest_candidate" ]] && \
             git merge-base --is-ancestor "$latest_candidate" HEAD; then
            echo "journaled=true" >> "$GITHUB_OUTPUT"
          else
            echo "journaled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve GitHub App bot identity
        id: app_bot
        if: steps.state.outputs.current == 'true' && steps.state.outputs.journaled == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Append tested reconciliation journal entry
        if: steps.state.outputs.current == 'true' && steps.state.outputs.journaled == 'false'
        shell: bash
        env:
          APP_BOT_NAME: ${{ steps.app_bot.outputs.name }}
          APP_BOT_EMAIL: ${{ steps.app_bot.outputs.email }}
          VALIDATION_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          merge_commit="$(git rev-parse HEAD^)"
          if [[ "$(git rev-list --parents -n 1 "$merge_commit" | wc -w | tr -d ' ')" != "3" ]]; then
            echo "Expected the reconciliation candidate parent to be an upstream merge commit." >&2
            exit 1
          fi
          previous_alpha="$(git rev-parse "$merge_commit^1")"
          upstream_sha="$(git rev-parse "$merge_commit^2")"
          node scripts/record-alpha-safe-sync.ts journal \
            --root "$GITHUB_WORKSPACE" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --previous-alpha "$previous_alpha" \
            --upstream-sha "$upstream_sha" \
            --candidate "$candidate" \
            --validation-url "$VALIDATION_URL"
          git config user.name "$APP_BOT_NAME"
          git config user.email "$APP_BOT_EMAIL"
          git add .alpha/reconciliation.jsonl
          git commit --no-verify -m "chore(alpha): journal automated upstream reconciliation"
          git push origin HEAD:automation/upstream-main

      - name: Enable merge after journaled candidate CI
        if: steps.state.outputs.current == 'true' && steps.state.outputs.journaled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pull_request.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --auto \
            --match-head-commit "${{ steps.state.outputs.head }}"
