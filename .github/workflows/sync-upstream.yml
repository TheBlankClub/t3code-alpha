name: Sync Upstream

on:
  schedule:
    - cron: "37 2,8,14,20 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare upstream merge
    if: github.repository == 'TheBlankClub/t3code-alpha'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SYNC_BRANCH: automation/upstream-main
      UPSTREAM_REPOSITORY: pingdotgg/t3code
    steps:
      - id: app_token
        name: Mint Alpha automation token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ALPHA_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ALPHA_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout Alpha
        uses: actions/checkout@v6
        with:
          ref: alpha
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Fetch upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main --tags

      - id: divergence
        name: Check divergence
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(git rev-parse upstream/main)"
          alpha_sha="$(git rev-parse HEAD)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "alpha_sha=$alpha_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Alpha already contains upstream/main at $upstream_sha."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "Alpha needs upstream/main at $upstream_sha."
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - id: classify
        name: Classify Alpha overlap risk
        if: steps.divergence.outputs.needs_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          merge_base="$(git merge-base HEAD upstream/main)"
          alpha_paths="$RUNNER_TEMP/alpha-delta-paths.txt"
          upstream_paths="$RUNNER_TEMP/incoming-upstream-paths.txt"
          report="$RUNNER_TEMP/alpha-sync-classification.md"
          git diff --name-only "$merge_base"..HEAD | sort -u > "$alpha_paths"
          git diff --name-only "$merge_base"..upstream/main | sort -u > "$upstream_paths"
          node scripts/classify-alpha-sync.ts \
            --alpha-paths-file "$alpha_paths" \
            --upstream-paths-file "$upstream_paths" \
            --policy .alpha/auto-sync-policy.json \
            --report "$report" \
            --github-output "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare merge branch
        if: steps.divergence.outputs.needs_sync == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"

          if git merge --no-ff --no-edit upstream/main; then
            exit 0
          fi

          conflicts_file="$RUNNER_TEMP/upstream-conflicts.txt"
          git diff --name-only --diff-filter=U > "$conflicts_file"
          git merge --abort

          issue_body="$RUNNER_TEMP/upstream-conflict-issue.md"
          {
            echo "The scheduled Alpha sync could not merge upstream/main cleanly."
            echo
            echo "- Alpha base: \`${{ steps.divergence.outputs.alpha_sha }}\`"
            echo "- Upstream main: \`${{ steps.divergence.outputs.upstream_sha }}\`"
            echo
            echo "Conflicted files:"
            echo '```text'
            cat "$conflicts_file"
            echo '```'
            echo
            echo "Use the repository's \`maintain-alpha-fork\` skill to reconcile this merge upstream-first."
          } > "$issue_body"

          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'Upstream sync is blocked in:title' \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body-file "$issue_body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Upstream sync is blocked" \
              --body-file "$issue_body"
          fi
          exit 1

      - name: Record safe reconciliation candidate
        if: steps.divergence.outputs.needs_sync == 'true' && steps.classify.outputs.safe == 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.divergence.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          node scripts/record-alpha-safe-sync.ts prepare \
            --root "$GITHUB_WORKSPACE" \
            --upstream-sha "$UPSTREAM_SHA" \
            --date "$(date -u +%F)"
          git add .alpha/features
          git commit -m "chore(alpha): record automated upstream reconciliation"

      - name: Push merge branch
        if: steps.divergence.outputs.needs_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SYNC_BRANCH" || true
          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"

      - id: pull_request
        name: Create or update sync pull request
        if: steps.divergence.outputs.needs_sync == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/upstream-sync-pr.md"
          {
            echo "Merges official upstream/main into Alpha with merge ancestry preserved."
            echo
            echo "- Alpha base: \`${{ steps.divergence.outputs.alpha_sha }}\`"
            echo "- Upstream main: \`${{ steps.divergence.outputs.upstream_sha }}\`"
            echo
            cat "${{ steps.classify.outputs.report }}"
            echo
            echo "Before merging:"
            echo
            echo "- [ ] Run the \`maintain-alpha-fork\` workflow."
            echo "- [ ] Classify every active \`.alpha/features/*.md\` record."
            echo "- [ ] Retire Alpha deltas that upstream supersedes."
            echo "- [ ] Add the reconciliation journal entry and update feature records."
            echo "- [ ] Confirm CI and retained Alpha behavior on this exact head."
          } > "$body_file"

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base alpha \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base alpha \
              --head "$SYNC_BRANCH" \
              --title "chore(alpha): sync upstream main" \
              --body-file "$body_file")"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore(alpha): sync upstream main" \
              --body-file "$body_file"
            pr_url="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Prepared $pr_url"

      - name: Apply automation safety labels
        if: steps.pull_request.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          SAFE: ${{ steps.classify.outputs.safe }}
        run: |
          set -euo pipefail
          gh label create alpha-auto-sync \
            --repo "$GITHUB_REPOSITORY" \
            --color "1f883d" \
            --description "Safe upstream reconciliation eligible for automatic merge" \
            --force
          gh label create alpha-review-required \
            --repo "$GITHUB_REPOSITORY" \
            --color "d1242f" \
            --description "Upstream reconciliation requires semantic review" \
            --force

          if [[ "$SAFE" == "true" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label alpha-auto-sync
            gh api --method DELETE \
              "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/alpha-review-required" >/dev/null 2>&1 || true
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label alpha-review-required
            gh api --method DELETE \
              "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/alpha-auto-sync" >/dev/null 2>&1 || true
          fi

      - name: Report review-required upstream overlap
        if: steps.pull_request.outputs.number != '' && steps.classify.outputs.safe != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          issue_body="$RUNNER_TEMP/upstream-review-required.md"
          {
            echo "The six-hour upstream sync prepared a clean Git merge, but Alpha safety policy requires semantic review."
            echo
            echo "- Pull request: ${{ steps.pull_request.outputs.url }}"
            echo "- Alpha base: \`${{ steps.divergence.outputs.alpha_sha }}\`"
            echo "- Upstream main: \`${{ steps.divergence.outputs.upstream_sha }}\`"
            echo
            cat "${{ steps.classify.outputs.report }}"
          } > "$issue_body"
          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'Upstream sync is blocked in:title' \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body-file "$issue_body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Upstream sync is blocked" \
              --body-file "$issue_body"
          fi

      - name: Resolve previous conflict notice
        if: steps.pull_request.outputs.number != '' && steps.classify.outputs.safe == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'Upstream sync is blocked in:title' \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            gh issue close "$existing_issue" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "A policy-safe upstream merge is now prepared in ${{ steps.pull_request.outputs.url }}."
          fi
