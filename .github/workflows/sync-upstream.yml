name: Sync Upstream

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare upstream merge
    if: github.repository == 'TheBlankClub/t3code-alpha'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SYNC_BRANCH: automation/upstream-main
      UPSTREAM_REPOSITORY: pingdotgg/t3code
    steps:
      - id: app_token
        name: Mint Alpha automation token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ALPHA_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ALPHA_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout Alpha
        uses: actions/checkout@v6
        with:
          ref: alpha
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Fetch upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main --tags

      - id: divergence
        name: Check divergence
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(git rev-parse upstream/main)"
          alpha_sha="$(git rev-parse HEAD)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "alpha_sha=$alpha_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Alpha already contains upstream/main at $upstream_sha."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "Alpha needs upstream/main at $upstream_sha."
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare merge branch
        if: steps.divergence.outputs.needs_sync == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"

          if git merge --no-ff --no-edit upstream/main; then
            exit 0
          fi

          conflicts_file="$RUNNER_TEMP/upstream-conflicts.txt"
          git diff --name-only --diff-filter=U > "$conflicts_file"
          git merge --abort

          issue_body="$RUNNER_TEMP/upstream-conflict-issue.md"
          {
            echo "The scheduled Alpha sync could not merge upstream/main cleanly."
            echo
            echo "- Alpha base: \`${{ steps.divergence.outputs.alpha_sha }}\`"
            echo "- Upstream main: \`${{ steps.divergence.outputs.upstream_sha }}\`"
            echo
            echo "Conflicted files:"
            echo '```text'
            cat "$conflicts_file"
            echo '```'
            echo
            echo "Use the repository's \`maintain-alpha-fork\` skill to reconcile this merge upstream-first."
          } > "$issue_body"

          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'Daily upstream sync is blocked in:title' \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body-file "$issue_body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Daily upstream sync is blocked" \
              --body-file "$issue_body"
          fi
          exit 1

      - name: Push merge branch
        if: steps.divergence.outputs.needs_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SYNC_BRANCH" || true
          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"

      - id: pull_request
        name: Create or update sync pull request
        if: steps.divergence.outputs.needs_sync == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/upstream-sync-pr.md"
          {
            echo "Merges official upstream/main into Alpha with merge ancestry preserved."
            echo
            echo "- Alpha base: \`${{ steps.divergence.outputs.alpha_sha }}\`"
            echo "- Upstream main: \`${{ steps.divergence.outputs.upstream_sha }}\`"
            echo
            echo "Before merging:"
            echo
            echo "- [ ] Run the \`maintain-alpha-fork\` workflow."
            echo "- [ ] Classify every active \`.alpha/features/*.md\` record."
            echo "- [ ] Retire Alpha deltas that upstream supersedes."
            echo "- [ ] Add the reconciliation journal entry and update feature records."
            echo "- [ ] Confirm CI and retained Alpha behavior on this exact head."
          } > "$body_file"

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base alpha \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base alpha \
              --head "$SYNC_BRANCH" \
              --title "chore(alpha): sync upstream main" \
              --body-file "$body_file")"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore(alpha): sync upstream main" \
              --body-file "$body_file"
            pr_url="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Prepared $pr_url"

      - name: Resolve previous conflict notice
        if: steps.pull_request.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'Daily upstream sync is blocked in:title' \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            gh issue close "$existing_issue" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "A clean upstream merge is now prepared in ${{ steps.pull_request.outputs.url }}."
          fi
